<body class="bg-slate-50 text-slate-900">
  <main class="min-h-screen py-10 px-4">
    <section class="max-w-xl mx-auto bg-white rounded-xl border border-slate-200 p-6 md:p-8">
      <a href="index.html" class="inline-flex mb-6">
        <img src="gt-ascend-logo.png" alt="Company logo" class="h-8 w-auto brightness-110 contrast-110" />
      </a>

      <h1 class="text-2xl font-bold mb-2">Book a Call</h1>
      <p class="text-slate-600 mb-6">Fill in your details, then continue to secure your call time.</p>

      <div id="status" class="hidden mb-4 rounded-lg p-3 text-sm"></div>

      <form id="booking-form" action="book-call-submit.php" method="post" class="space-y-5">
        <input type="hidden" name="source_page" value="book-a-call.html" />

        <div>
          <label for="name" class="block text-sm font-medium mb-1">Name</label>
          <input id="name" name="name" type="text" required class="w-full rounded-lg border-slate-300" />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium mb-1">Email</label>
          <input id="email" name="email" type="email" required class="w-full rounded-lg border-slate-300" />
        </div>
        <div>
          <label for="company" class="block text-sm font-medium mb-1">Company Name / Website</label>
          <input id="company" name="company" type="text" required class="w-full rounded-lg border-slate-300" />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">
          Continue to Schedule
        </button>
      </form>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = document.getElementById('status');
    if (params.get('status') === 'error') {
      status.className = 'mb-4 rounded-lg p-3 text-sm bg-red-100 text-red-800';
      status.textContent = 'We could not process your details. Please try again.';
      status.classList.remove('hidden');
    }
  </script>
