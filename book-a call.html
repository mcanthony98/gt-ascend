<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Call</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="min-h-screen py-10 px-4">
    <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
      <section class="bg-white rounded-xl border border-slate-200 p-6 md:p-8">
        <a href="index.html" class="inline-flex mb-6">
          <img src="gt-ascend-logo.png" alt="Company logo" class="h-10 w-auto" />
        </a>

        <h1 class="text-2xl font-bold mb-2">Book a Call</h1>
        <p class="text-slate-600 mb-6">Fill in your details, then pick a time on Calendly.</p>

        <div id="status" class="hidden mb-4 rounded-lg p-3 text-sm"></div>

        <form id="booking-form" action="book-call-submit.php" method="post" class="space-y-5">
          <input type="hidden" name="source_page" value="book-a call.html" />

          <div id="step-1" class="space-y-4">
            <div>
              <label for="name" class="block text-sm font-medium mb-1">Name</label>
              <input id="name" name="name" type="text" required class="w-full rounded-lg border-slate-300" />
            </div>
            <div>
              <label for="email" class="block text-sm font-medium mb-1">Email</label>
              <input id="email" name="email" type="email" required class="w-full rounded-lg border-slate-300" />
            </div>
            <div>
              <label for="company" class="block text-sm font-medium mb-1">Company Name / Website</label>
              <input id="company" name="company" type="text" required class="w-full rounded-lg border-slate-300" />
            </div>
            <button type="button" id="to-step-2" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">Continue to Calendar</button>
          </div>

          <div id="step-2" class="hidden space-y-4">
            <div class="rounded-lg bg-slate-100 p-4 text-sm">
              <p><strong>Name:</strong> <span id="review-name"></span></p>
              <p><strong>Email:</strong> <span id="review-email"></span></p>
              <p><strong>Company/Website:</strong> <span id="review-company"></span></p>
            </div>
            <div class="flex gap-3">
              <button type="button" id="back-step-1" class="px-5 py-3 rounded-lg border border-slate-300 font-semibold">Back</button>
              <button type="submit" class="px-5 py-3 rounded-lg bg-slate-900 text-white font-semibold">Send Details to Email</button>
            </div>
            <p class="text-xs text-slate-500">After sending, scroll to pick your call time below.</p>
          </div>
        </form>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 p-4 md:p-6">
        <h2 class="text-xl font-bold mb-3">Choose Your Time</h2>
        <p class="text-slate-600 mb-4">Schedule directly using Calendly.</p>
        <div class="calendly-inline-widget" data-url="https://calendly.com/tutorjamesbenjamin/30min?hide_event_type_details=1&hide_gdpr_banner=1" style="min-width:320px;height:700px;"></div>
      </section>
    </div>
  </main>

  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <script>
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const toStep2 = document.getElementById('to-step-2');
    const backStep1 = document.getElementById('back-step-1');

    toStep2.addEventListener('click', () => {
      const name = document.getElementById('name');
      const email = document.getElementById('email');
      const company = document.getElementById('company');

      if (!name.reportValidity() || !email.reportValidity() || !company.reportValidity()) {
        return;
      }

      document.getElementById('review-name').textContent = name.value;
      document.getElementById('review-email').textContent = email.value;
      document.getElementById('review-company').textContent = company.value;

      step1.classList.add('hidden');
      step2.classList.remove('hidden');
    });

    backStep1.addEventListener('click', () => {
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
    });

    const params = new URLSearchParams(window.location.search);
    const status = document.getElementById('status');
    if (params.get('status') === 'success') {
      status.className = 'mb-4 rounded-lg p-3 text-sm bg-emerald-100 text-emerald-800';
      status.textContent = 'Your details were sent successfully. Now complete your booking in Calendly.';
      status.classList.remove('hidden');
    }
    if (params.get('status') === 'error') {
      status.className = 'mb-4 rounded-lg p-3 text-sm bg-red-100 text-red-800';
      status.textContent = 'We could not send your details. Please try again.';
      status.classList.remove('hidden');
    }
  </script>
</body>
</html>
